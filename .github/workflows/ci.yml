name: CI

# Verificações independentes dos agentes. Corre em pushes e pull requests,
# e é chamado pelo ciclo diário depois de enviar os commits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Projeto ainda por criar?
        id: existe
        run: |
          if [ -f package.json ]; then echo "sim=true" >> "$GITHUB_OUTPUT"; else echo "sim=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        if: steps.existe.outputs.sim == 'true'
        with:
          node-version: 22

      - name: Instalar
        if: steps.existe.outputs.sim == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.existe.outputs.sim == 'true'
        run: pnpm run --if-present lint

      - name: Tipos
        if: steps.existe.outputs.sim == 'true'
        run: pnpm run --if-present typecheck

      - name: Testes
        if: steps.existe.outputs.sim == 'true'
        run: pnpm run --if-present test

      - name: Build
        if: steps.existe.outputs.sim == 'true'
        run: pnpm run --if-present build
